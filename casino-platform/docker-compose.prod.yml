version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # GAP-56 (остаток): сюда монтировался infra/scripts/postgres-backup.sh как
      # /docker-entrypoint-initdb.d/backup.sh. Файлы из initdb.d выполняются на ПЕРВОМ
      # старте при пустом томе, а скрипт рассчитан на ХОСТ (cron в DEPLOY.md §Monitoring,
      # `0 2 * * *`): под `set -euo pipefail` он зовёт `docker ps`/`docker exec` и читает
      # DB_USER/DB_NAME из ./env. Внутри postgres-контейнера нет ни docker CLI, ни .env →
      # скрипт падал с ненулевым кодом, postgres-abort'ил инициализацию и весь стек
      # не поднимался. Бэкап вызывается ТОЛЬКО с хоста — mount убран.
    restart: unless-stopped
    networks: [casino]
    healthcheck:
      { test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-casino}'], interval: 10s, retries: 5 }

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes: [redisdata:/data]
    restart: unless-stopped
    networks: [casino]
    healthcheck:
      { test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping'], interval: 10s, retries: 5 }

  api:
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    # Явный тег: сервис worker ниже переиспользует этот же образ (build только здесь).
    image: casino-platform-api
    # CMD образа — тот же main.js (fallback для docker run); здесь запуск
    # зафиксирован явно, чтобы сервис worker переиспользовал образ с другой точкой входа.
    command: ['node', 'apps/api/dist/main.js']
    env_file: [.env.production]
    # GAP-02 post-MVP: консьюмер очереди `email` живёт в отдельном сервисе worker —
    # в процессе API он отключён (по умолчанию флаг 'true' — dev-удобство).
    environment:
      EMAIL_WORKER_IN_PROCESS: 'false'
    # pre-launch hardening A4: воркеры BullMQ при close() ждут активные job'ы;
    # дефолтный grace 10s перебил бы их SIGKILL'ом. 45s > 30s BullMQ close-timeout.
    stop_grace_period: 45s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [casino]
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/v1/health/ready']
      interval: 30s
      timeout: 5s
      retries: 3
    # pre-launch hardening A3: pino пишет в stdout → docker json-file;
    # без max-size диск VPS умирает через пару месяцев
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  # GAP-02 post-MVP: отдельный процесс-консьюмер очереди `email` (apps/api/src/worker.ts).
  # Тот же образ, что у api (build только у api), другая команда; HTTP-сервера нет —
  # healthcheck не нужен и никто от него не зависит. Останавливается позже api
  # (grace 45s) — письма доразбираются до SIGKILL.
  worker:
    image: casino-platform-api
    command: ['node', 'apps/api/dist/worker.js']
    env_file: [.env.production]
    environment:
      EMAIL_WORKER_IN_PROCESS: 'true'
    stop_grace_period: 45s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [casino]
    volumes:
      - ./logs:/app/logs
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
      args:
        # GAP-56: интерполируется из .env (симлинк .env.production); дефолт —
        # исторический плейсхолдер. Build-arg запекается в бандл: сменив домен,
        # не забудь `docker compose build web`.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://casino.example.com/api/v1}
    env_file: [.env.production]
    # Next standalone-сервер берёт порт из process.env.PORT (дефолт 3000) и хост из
    # process.env.HOSTNAME. Docker сам проставляет HOSTNAME = ID контейнера, и тогда
    # сервер bind'ится на адрес eth0 — probe на 127.0.0.1 не проходил бы. Оба значения
    # фиксируем явно, чтобы healthcheck не зависел от угадывания окружения.
    environment:
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    # healthcheck + condition (было depends_on: [api] без condition): compose поднимал
    # nginx сразу, web ещё грелся, nginx отвечал 502 — а статус деплоя оставался
    # «зелёный», потому что `up -d` не ждёт готовности. Теперь up -d блокируется до
    # service_healthy и падает на неуспешном probe.
    healthcheck:
      # /legal/terms — полностью статичная страница (GAP-49), не ходит в API/БД,
      # поэтому 200 означает «Next отдаёт HTML» без побочных условий. Дефолтный /
      # для проверки не годится: он ISR с серверным fetch полок (GAP-55) и на старте
      # без API даёт 500.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/legal/terms']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [casino]
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  admin:
    build:
      context: .
      dockerfile: infra/docker/admin.prod.Dockerfile
      args:
        # GAP-59: admin — такой же NEXT_PUBLIC_-бандл, как web. Без build-arg в
        # образ уезжал ARG-дефолт `casino.example.com`, и на реальном домене
        # админка (axios 'use client', vhost admin без location /api/) уходила
        # на чужой хост. env_file на сборку не влияет — только build.args.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://casino.example.com/api/v1}
    env_file: [.env.production]
    # PORT обязан быть 3002: nginx-шаблон проксирует ADMIN_DOMAIN на http://admin:3002,
    # но Next standalone без process.env.PORT слушает 3000 (в образе EXPOSE 3000 — он
    # скопирован с web) → connection refused, vhost админки давал 502 на любом маршруте.
    # В dev это не ловилось: там `next start -p 3002` из package.json, а не server.js.
    environment:
      PORT: '3002'
      HOSTNAME: '0.0.0.0'
    healthcheck:
      # / — страница логина ('use client', пререндерится на сборке): отдаётся без
      # обращения к API/БД, поэтому 200 = «Next жив». Свой /api/health у admin нет.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [casino]
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

  nginx:
    image: nginx:alpine
    depends_on:
      # Без condition compose считал успехом сам факт старта контейнеров: nginx
      # поднимался раньше web/admin и на первых запросах отдавал 502, при этом
      # `up -d` и весь деплой оставались зелёными.
      api: { condition: service_healthy }
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
    healthcheck:
      # Зонд в /nginx-health (см. infra/nginx/templates/casino.conf.template):
      # отдельный listen на 127.0.0.1:8080, наружу не публикуется. Хватать через
      # публичный 80-порт «/» нельзя — там 301 на https, а 443 на первом старте без
      # сертификатов. ACL «allow 127.0.0.1» в публичном vhost'е проверен и ненадёжен
      # (docker-proxy зацикливает внешнее соединение на loopback) — поэтому вынесен
      # на отдельный loopback-listen, а не в 80-й сервер.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - '80:80'
      - '443:443'
    # GAP-56: DOMAIN/ADMIN_DOMAIN подставляются envsubst'ом в шаблон
    # (infra/nginx/templates/casino.conf.template → /etc/nginx/conf.d/casino.conf).
    # envsubst заменяет только эти имена — nginx-переменные ($host и пр.) не задеты,
    # т.к. их нет в окружении контейнера.
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN задай в .env.production (симлинк .env), см. ENVIRONMENT_VARIABLES §2}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN задай в .env.production, см. ENVIRONMENT_VARIABLES §2}
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      # GAP-56: snippets раньше не монтировался — include /etc/nginx/snippets/ssl.conf
      # ронял nginx на первом старте (nginx: [emerg] open() ... failed)
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - ./uploads:/var/www/uploads:ro
    # GAP-56: дефолтный default.conf образа слушает :80 и отдаёт welcome-страницу
    # по прямому IP; убираем до старта nginx (envsubst-скрипты entrypoint к этому
    # моменту уже сгенерировали conf.d/casino.conf из шаблона).
    command: ['sh', '-c', "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    networks: [casino]
    logging:
      driver: json-file
      options: { max-size: '50m', max-file: '5' }

volumes:
  pgdata:
  redisdata:
  # GAP-56: фиксированные имена (без префикса проекта) — infra/scripts/ssl_init.sh
  # и renew-cron монтируют docker -v certbot_certs:... / certbot_www:... буквально;
  # без name: compose создал бы casino-platform_certbot_certs, и сертификаты
  # осели бы в томе, который nginx не видит.
  certbot_certs: { name: certbot_certs }
  certbot_www: { name: certbot_www }

networks:
  casino:
    driver: bridge
