user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main_json escape=json
    '{ "time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"rt":$request_time,'
    '"ua":"$http_user_agent","ref":"$http_referer","request_id":"$http_x_request_id" }';
  access_log /var/log/nginx/access.log main_json;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10m;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;
  # rate limit zones
  # Слои защиты (см. SECURITY_BASELINE §2.3 и GAP-19):
  #  - эти зоны — пер-IP троттлинг на транспортном уровне (совпадает с примером ТЗ §Rate Limiting);
  #  - требование «10 неудачных login за 15 мин → блок 30 мин» (§2.3) — это per-ACCOUNT lockout,
  #    он реализован на app-уровне (login.use-case + LOCKOUT_MAX_ATTEMPTS/WINDOW/DURATION_MS),
  #    и НЕ должен равняться nginx-зоне — это разные механизмы (IP vs аккаунт);
  #  - app-уровень Throttler /auth/* (THROTTLE_AUTH_LIMIT, по умолчанию 10/мин) сознательно
  #    совпадает с api_auth 10r/m — двойной пер-IP барьер с одним порогом.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=webhooks:10m rate=100r/m;
  include /etc/nginx/conf.d/*.conf;
}
