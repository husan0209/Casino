# Общий набор security-заголовков для vhost'ов и для location'ов со своими add_header.
#
# Почему это файл-сниппет, а не «один раз в server»: nginx НАСЛЕДУЕТ add_header
# во вложенный блок только если в самом блоке нет НИ ОДНОЙ своей add_header.
# Любой location, добавивший хотя бы один заголовок (например /uploads/avatars/
# с Cache-Control для expires 30d), молча теряет ВСЕ заголовки родительского
# server'а — nosniff/HSTS/Referrer-Policy исчезают вместе с ним. Поэтому полный
# набор обязан включаться в такой location явно, а не держаться в двух местах.
#
# X-Frame-Options здесь сознательно нет: он разный по vhost'ам (web — SAMEORIGIN
# для iframe'ов своих игр/виджетов, admin — DENY) и задаётся в server-блоке.
#
# CSP здесь тоже нет намеренно: его отдаёт приложение (Next middleware / helmet),
# а браузер ПЕРЕСЕКАЕТ несколько CSP-заголовков — дубль только ужесточил бы
# политику незаметно от ревью. См. комментарий в casino.conf.template.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
