name: CI

# Единый CI репозитория. Проект живёт в casino-platform/ (defaults.working-directory).
# Обязательные status-чеки ruleset: secrets-scan, commitlint, lint-typecheck-test,
# docker-build (+ Architecture guards, docs-guard). ВАЖНО: у обязательных job НЕТ name: —
# имя чека = job id. display-name заставил бы ruleset ждать чек, который никогда не придёт.

on:
  push:
    branches: [main, dev]
    paths:
      - 'casino-platform/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: casino-platform

env:
  # На CI symlinks доступны: bin-links нужны, чтобы package.json-скрипты резолвили tsc/eslint/nest.
  # Локально на FAT/sdcard действует .npmrc (bin-links=false) — там вызовы через node <bin>.
  npm_config_bin_links: 'true'

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install toolchain
        run: pnpm install --frozen-lockfile
      - name: Lint commits
        run: |
          FROM=""
          # для PR — база PR: после force-push event.before указывает на
          # перезаписанный SHA, которого нет в fetch → Invalid revision range
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FROM="${{ github.event.before }}"
          fi
          # FROM может быть dangling — проверяем ревизию, иначе фолбэк на origin/main
          if [ -n "$FROM" ] && ! git rev-parse -q --verify "${FROM}^{commit}" >/dev/null 2>&1; then
            echo "FROM ${FROM} not found in history (force-push?) — falling back to origin/main"
            FROM=origin/main
          fi
          if [ -z "$FROM" ]; then
            echo "No commit range detected — skipping"
            exit 0
          fi
          echo "Committing range: ${FROM}..HEAD"
          # Squash-мержи: заголовок/боди редактируются в UI при мерже и не проходили
          # commitlint на PR-ветке. На push в main проверяем только свежий squash-коммит
          # (переписать историю нельзя — ruleset), иначе краснеет ВЕСЬ диапазон за день.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            pnpm exec commitlint --from "HEAD~1" --to HEAD
          else
            pnpm exec commitlint --from "${FROM}" --to HEAD
          fi

  # README обещает pnpm audit среди обязательных чеков — теперь он тут.
  # Без name: (чек = job id), как у остальных required-джоб (см. D6).
  # Режим — храповик (docs/TECH_DEBT.md): job краснеет только если какой-то
  # severity ВЫРОС против базлайна.
  # ВАЖНО о нуле: `pnpm audit --prod` отдаёт advisories уже фильтрованным —
  # pnpm.auditConfig.ignoreGhsas (27 записей) снимает ~28 advisory-записей
  # metadata, поэтому tech-debt/pnpm-audit.txt = 0/0/0/0 означает «не выросло
  # против принятой заглушки», а не «в prod-дереве нет уязвимостей».
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: casino-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (prod) — ratchet
        run: |
          pnpm audit --prod --json > /tmp/audit.json || true
          node scripts/audit-ratchet.mjs --check /tmp/audit.json

  # Dev-контур не попадал ни в одну проверку: `--prod` его не видит, а этот код
  # исполняется на прогоне CI и на машине разработчика. Фактически: 1 critical
  # (vitest <3.2.6), 8 high, 7 moderate, 3 low — заморожено в
  # tech-debt/pnpm-audit-dev.txt, критичное снимается только vitest 2→3.
  #
  # Job намеренно НЕ добавлен в required (шапка файла, docs/BRANCH_PROTECTION):
  # допуск канарейки полноты для этого отчёта выбран ровно по границе
  # (metadata=48 − видимых=19 ≤ mute-лист=27 + slack=2), поэтому на другой
  # версии pnpm шаг способен покраснеть БЕЗ роста долга. Сначала наблюдение —
  # в required после того, как vitest поднимется (или риск примет владелец).
  audit-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: casino-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: pnpm audit (полное дерево) — ratchet
        run: |
          pnpm audit --json > /tmp/audit-dev.json || true
          node scripts/audit-ratchet.mjs --check /tmp/audit-dev.json tech-debt/pnpm-audit-dev.txt

  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casino
          POSTGRES_PASSWORD: casino_test
          POSTGRES_DB: casino_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://casino:casino_test@localhost:5432/casino_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: casino-platform/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm db:generate
      # Workspace-пакеты → dist ДО lint/typecheck: shared-utils ссылается на собранный
      # shared-types (TS6305 на свежем дереве), tsconfig.build.json api резолвит @casino/* на dist
      - name: Build workspace packages
        run: pnpm --filter @casino/shared-types --filter @casino/shared-utils --filter @casino/shared-config --filter @casino/database build
      # Интеграционные тесты wallet ledger (GAP-24 остаток): схема → тестовую БД.
      # GAP-31: применяем МИГРАЦИИ (как в проде), а не db push — так CI ловит дрейф
      # schema.prisma ↔ migrations/ (упадёт, если модель изменили без новой миграции)
      - name: Prisma migrate deploy (test schema)
        run: pnpm --filter @casino/database exec prisma migrate deploy
      # Дрейф-детектор: --exit-code (0 = миграции ≡ schema.prisma, 2 = есть diff).
      # Не парсим stdout: при отсутствии diff Prisma печатает строку "No difference
      # detected." — непустой вывод был ложным срабатыванием (GAP-31, поймано CI)
      - name: Verify no schema drift
        run: |
          pnpm --filter @casino/database exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
          echo "✅ No drift: migrations ≡ schema.prisma"
      # Прод-контур статичен по конфигам: проверка, что ни один nginx-location со
      # своим add_header не остался без общего сниппета security-headers (см.
      # infra/scripts/check-nginx-header-inheritance.sh). Дёргается здесь, а не в
      # architecture-guards, потому что этот job — обязательный чек ruleset.
      - name: Check nginx security-header inheritance
        run: bash infra/scripts/check-nginx-header-inheritance.sh
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
        env:
          # включает ledger.integration.spec.ts (без флага — скипаются локально)
          LEDGER_INTEGRATION: '1'
      - name: Build
        run: pnpm build
      - name: E2E player lifecycle (GAP-05)
        env:
          # поднимает СОБРАННЫЙ сервер (dist/main.js) против тестовой БД + Redis;
          # NestFactory внутри vitest-воркера крашит процесс - потому сервер в фоне
          E2E_API: '1'
          JWT_ACCESS_SECRET: e2e-access-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: e2e-refresh-secret-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RUKASSA_SECRET_KEY: e2e-rukassa-hmac-secret
          RUKASSA_SHOP_ID: e2e-shop
          RUKASSA_API_BASE: http://localhost:9
          # demo-провайдер для launch/Callbacks (envSchema: enum 'true'/'false')
          DEMO_PROVIDER_ENABLED: 'true'
          APP_PORT: '3001'
          APP_URL: http://localhost:3000
          ADMIN_URL: http://localhost:3002
          DOMAIN: localhost
        run: |
          node apps/api/dist/main.js &
          SERVER_PID=$!
          npx --yes wait-on http://127.0.0.1:3001/api/v1/health/ready -t 30000 || { kill $SERVER_PID; exit 1; }
          pnpm --filter @casino/api exec vitest run test/e2e; CODE=$?
          kill $SERVER_PID
          exit $CODE

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test]
    # GAP-59 (п.3 аудита): было `if: github.ref == 'refs/heads/main'` и один api.prod —
    # сборки web/admin не проверялись ни на PR, ни на main, поэтому отсутствующий
    # output: standalone и build-arg NEXT_PUBLIC_API_URL (GAP-59) доехали до деплоя.
    # Теперь все три прод-образа собираются и на PR, и на push в main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API (test)
        uses: docker/build-push-action@v5
        with:
          # Контекст = casino-platform (Dockerfile копирует package.json/packages/apps/api
          # от workspace-корня; в корне РЕПО их нет — раньше падало «/apps/api: not found»
          # на каждом push в main).
          context: ./casino-platform
          file: ./casino-platform/infra/docker/api.prod.Dockerfile
          push: false
          tags: casino-api:test
      - name: Build Web (test)
        uses: docker/build-push-action@v5
        with:
          # NEXT_PUBLIC_API_URL — явный build-arg, ровно как у сервиса web в
          # docker-compose.prod.yml: иначе в образ уезжает ARG-дефолт
          # casino.example.com (GAP-59). Шрифт самохостын (GAP-59 п.2), поэтому
          # сборка больше не зависит от fonts.googleapis.com.
          context: ./casino-platform
          file: ./casino-platform/infra/docker/web.prod.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://casino.example.com/api/v1
          push: false
          tags: casino-web:test
      - name: Build Admin (test)
        uses: docker/build-push-action@v5
        with:
          # Тот же build-arg, что и у web/admin в docker-compose.prod.yml (GAP-59).
          context: ./casino-platform
          file: ./casino-platform/infra/docker/admin.prod.Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=https://casino.example.com/api/v1
          push: false
          tags: casino-admin:test

  # ВАЖНО про статус этого job'а (не «гарантия выкатки»):
  #   1) deploy НЕ входит в список обязательных чеков ruleset (см. докблок в начале
  #      файла: secrets-scan, commitlint, lint-typecheck-test, docker-build + guards).
  #   2) На PR и на push не в main job не выполняется (`if:` ниже) — GitHub рисует
  #      skipped как «пройдено», и зелёная галочка ничего не утверждает.
  #   3) На push в main без секретов VPS_* job проходит, но НЕ ДЕЛАЕТ выкатку:
  #      шага Deploy просто нет (steps.vps-secrets.outputs.skip). Зелёный цвет здесь
  #      означает «CI красным не нашёл», а не «прод обновлён».
  # Красить main при непроставленных секретах намеренно НЕ стали: каждый мерж
  # превратился бы в ложный пожар у тех, кто прод-контур ещё не настраивал. Вместо
  # этого факт «выкатки не было» пишется заголовком в summary runs — там, где его
  # видно вместо зелёного кружка.
  deploy:
    name: Deploy to VPS (only after green CI)
    needs: [secrets-scan, commitlint, lint-typecheck-test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Проверка VPS-секретов
        id: vps-secrets
        # deploy-джоба без checkout; глобальный defaults.run.working-directory
        # (casino-platform) здесь не существует — переопределяем на корень раннера
        working-directory: .
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy пропущен: не настроены секреты VPS_HOST / VPS_USER / VPS_SSH_KEY (Settings → Secrets and variables → Actions)"
            # Зелёный job без этой строки читается как «выкатка прошла» — поэтому
            # состояние пишется в summary вкладки Runs отдельным заголовком.
            {
              echo "## Выкатка НЕ выполнена"
              echo ""
              echo "Job \`deploy\` завершился успешно, но **ничего не деплоил**: секреты"
              echo "\`VPS_HOST\` / \`VPS_USER\` / \`VPS_SSH_KEY\` не настроены."
              echo ""
              echo "Зелёный статус этого job'а — не признак обновлённого прод-контура."
              echo "Обязательные по смыслу чеки: secrets-scan, commitlint, lint-typecheck-test, docker-build."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy via SSH
        if: steps.vps-secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/casino-platform
            git pull origin main
            docker compose -f docker-compose.prod.yml pull || true
            docker compose -f docker-compose.prod.yml build --pull
            # `up -d` с service_healthy-условиями (см. docker-compose.prod.yml) НЕ
            # считается успешным, пока api/web/admin/nginx не прошли свои probe:
            # раньше деплой «зеленел» при 502 от nginx, потому что `up -d` не ждёт
            # готовности, а healthcheck'ов у фронта и nginx не было вовсе.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Schema живёт в packages/database/prisma, а WORKDIR образа — /app, и ни в
            # корневом package.json, ни в packages/database/package.json поля `prisma`
            # нет. Без --schema Prisma ищет ./prisma/schema.prisma от cwd, не находит
            # («Could not find a prisma schema file») и деплой с новой миграцией красный.
            # pnpm в runtime-стадии нет (corepack только в builder), поэтому явный путь.
            docker compose -f docker-compose.prod.yml exec -T api npx prisma migrate deploy \
              --schema=packages/database/prisma/schema.prisma
            docker compose -f docker-compose.prod.yml ps
            echo "Deploy OK $(date)"
