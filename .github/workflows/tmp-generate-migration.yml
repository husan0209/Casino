# ОДНОРАЗОВЫЙ воркфлоу (GAP-31): генерирует baseline-миграцию на ubuntu,
# т.к. prisma schema-engine не запускается на Android/Termux. Будет удалён
# из ветки после получения артефакта — в main не попадёт.
name: tmp generate baseline migration
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/tmp-generate-migration.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: casino-platform
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate baseline SQL (from-empty → schema.prisma)
        run: |
          mkdir -p packages/database/prisma/migrations/0_init
          pnpm --filter @casino/database exec prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > packages/database/prisma/migrations/0_init/migration.sql
          printf 'provider = "postgresql"\n' > packages/database/prisma/migrations/migration_lock.toml
          echo "tables: $(grep -c 'CREATE TABLE' packages/database/prisma/migrations/0_init/migration.sql)"
          tail -3 packages/database/prisma/migrations/0_init/migration.sql
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-migration
          path: |
            casino-platform/packages/database/prisma/migrations/0_init/migration.sql
            casino-platform/packages/database/prisma/migrations/migration_lock.toml
          retention-days: 3
