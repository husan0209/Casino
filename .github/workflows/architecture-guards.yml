name: Architecture & Codebase Guards

# Tier 2 of docs/archive/audit-2026-08-25.md remediation plan.
# Runs grep-based architecture guards that ESLint cannot express.
# These are *separate* from the `ci.yml` lint job — they enforce
# project-specific invariants from docs/AI_DEVELOPMENT_RULES.md,
# docs/SECURITY_BASELINE.md, and .cursorrules.
#
# Each guard maps to a row in docs/archive/audit-2026-08-25.md (ID column).
# If a guard fails, the message names the audit ID so the author
# can find the context.
#
# To skip a guard locally (e.g. for a false positive), use the
# `// arch-guard: disable-next-line` comment on the offending line
# AND link the ticket/issue that justifies it.

on:
  pull_request:
    branches: [main, dev]
    paths: ['casino-platform/**', '.github/workflows/**']
  push:
    branches: [main, dev]
    paths: ['casino-platform/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

# Проект живёт в casino-platform/ — все run-шаги выполняются оттуда
defaults:
  run:
    working-directory: casino-platform

jobs:
  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casino-platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────────────────────
      # A. No direct prisma.* in domain/application layers
      # Catches: docs/archive/audit-2026-08-25.md §A3, A4, H5
      # Rule: docs/AI_DEVELOPMENT_RULES.md §3.2, .cursorrules §"Cross-module"
      # ──────────────────────────────────────────────────────────────
      - name: G1 — no direct prisma in domain/application
        id: g1
        run: |
          # import('@casino/database') тоже ловим: динамический импорт не видит
          # ESLint no-restricted-imports (история: maintenance/update-rates.job.ts).
          # Рантайм-импорт '@prisma/client' в domain/application запрещён так же;
          # type-only импорты разрешены конвенцией (casino.repository.ts) — awk
          # вырезает import type {...} (в т.ч. многострочные) до проверки.
          HITS=""
          for F in $(find apps/api/src/modules/*/domain apps/api/src/modules/*/application \
                        -name '*.ts' ! -name '*.spec.ts' ! -name '*.test.ts' 2>/dev/null); do
            M=$(awk 'intype{if($0~/from /)intype=0;next}
                     /^[[:space:]]*import type/{if($0!~/from /)intype=1;next}
                     /^[[:space:]]*import \{[^}]*\} from /{
                       s=$0; sub(/^[^{]*\{/,"",s); sub(/\}.*/,"",s)
                       n=split(s,p,","); ok=(n>0)
                       for(i=1;i<=n;i++){t=p[i];gsub(/^[ \t]+|[ \t]+$/,"",t); if(t!~/^type[ \t]/)ok=0}
                       if(ok)next
                     }
                     {print}' "$F" |
                  grep -E "(from |import\()['\"](@casino/database|@prisma/client)['\"]" || true)
            [ -n "$M" ] && HITS="$HITS$F:$M
          "
          done
          if [ -n "$HITS" ]; then
            echo "❌ G1 FAIL: prisma imported at runtime in domain/application:"
            echo "$HITS" | sed 's/^/   /'
            echo "   See docs/archive/audit-2026-08-25.md §A3, A4, H5."
            echo "   Use a Repository interface (IXxxRepository) or a Facade."
            echo "   Type-only '@prisma/client' imports are allowed (see casino.repository.ts)."
            exit 1
          fi
          echo "✅ G1 OK"

      # ──────────────────────────────────────────────────────────────
      # B. No @ts-ignore / @ts-nocheck in production code
      # Catches: docs/archive/audit-2026-08-25.md §C1, GENERAL best practice
      # Rule: docs/CONVENTIONS.md §1.3 (forbidden)
      # ──────────────────────────────────────────────────────────────
      - name: G2 — no @ts-ignore / @ts-nocheck
        id: g2
        run: |
          HITS=$(grep -rnE "@ts-(ignore|nocheck|expect-error)" \
            apps/web/src apps/admin/src apps/api/src packages 2>/dev/null \
            | grep -v "\.spec\.ts" | grep -v "\.test\.ts" || true)
          if [ -n "$HITS" ]; then
            echo "❌ G2 FAIL: @ts-ignore/@ts-nocheck found:"
            echo "$HITS"
            echo "   See docs/archive/audit-2026-08-25.md §C1 and docs/CONVENTIONS.md §1.3."
            exit 1
          fi
          echo "✅ G2 OK"

      # ──────────────────────────────────────────────────────────────
      # C. No console.log in api code (only console.warn/error allowed)
      # Catches: docs/archive/audit-2026-08-25.md §C2
      # Rule: .eslintrc.js (no-console), docs/CONVENTIONS.md §7
      # ──────────────────────────────────────────────────────────────
      - name: G3 — no console.log in api
        id: g3
        run: |
          HITS=$(grep -rnE "console\.log\(" apps/api/src 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G3 FAIL: console.log in api:"
            echo "$HITS"
            echo "   See docs/archive/audit-2026-08-25.md §C2. Use Pino logger."
            exit 1
          fi
          echo "✅ G3 OK"

      # ──────────────────────────────────────────────────────────────
      # D. No @Body() any / @Body() { ... } without Zod
      # Catches: docs/archive/audit-2026-08-25.md §C3, N8, N9 (forgot-password, withdrawals)
      # Rule: docs/SECURITY_BASELINE.md §9.1, docs/API_CONVENTIONS.md §2
      # ──────────────────────────────────────────────────────────────
      - name: G4 — controllers must validate input
        id: g4
        run: |
          # Heuristic: look for @Body() typed as any, or @Body() followed by
          # body.* usage in the same line (i.e. no DTO extraction).
          HITS=$(grep -rnE "@Body\(\)\s+[a-zA-Z_]+:\s*any" \
            apps/api/src/modules/*/presentation/controllers 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G4 FAIL: @Body() any in controller (no Zod validation):"
            echo "$HITS"
            echo "   See docs/archive/audit-2026-08-25.md §C3, N8, N9."
            echo "   Use @UsePipes(new ZodValidationPipe(SomeSchema))."
            exit 1
          fi
          echo "✅ G4 OK"

      # ──────────────────────────────────────────────────────────────
      # E. Webhook controllers must save raw body
      # Catches: docs/archive/audit-2026-08-25.md §N5
      # Rule: docs/AI_DEVELOPMENT_RULES.md §8
      # ──────────────────────────────────────────────────────────────
      - name: G5 — webhook controllers persist raw body
        id: g5
        run: |
          # Look for @Post('webhooks') in controllers. For each, check that
          # there is a bodyParser with verify callback in main.ts.
          WEBHOOK_CTRLS=$(grep -rln "@Post('.*webhook" apps/api/src 2>/dev/null || true)
          if [ -n "$WEBHOOK_CTRLS" ]; then
            if ! grep -q "rawBody" apps/api/src/main.ts 2>/dev/null; then
              echo "❌ G5 FAIL: webhook controllers exist but main.ts has no rawBody setup."
              echo "   Files with webhooks: $WEBHOOK_CTRLS"
              echo "   See docs/archive/audit-2026-08-25.md §N5."
              echo "   Configure bodyParser({ verify: (req, _, buf) => { req.rawBody = buf } })."
              exit 1
            fi
          fi
          echo "✅ G5 OK"

      # ──────────────────────────────────────────────────────────────
      # F. No status.includes(...) on payment provider responses
      # Catches: docs/archive/audit-2026-08-25.md §H3 (Rukassa webhook: 'paid' matches 'unpaid')
      # Rule: docs/AI_DEVELOPMENT_RULES.md §8.2
      # ──────────────────────────────────────────────────────────────
      - name: G6 — no string-includes on payment status
        id: g6
        run: |
          HITS=$(grep -rnE "status\.(includes|startsWith|endsWith)" \
            apps/api/src/modules/payments 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G6 FAIL: string-match on payment status is unsafe:"
            echo "$HITS"
            echo "   See docs/archive/audit-2026-08-25.md §H3."
            echo "   'status.includes(\"paid\")' matches 'unpaid', 'prepaid', etc."
            echo "   Use explicit whitelist comparison: status === 'paid'."
            exit 1
          fi
          echo "✅ G6 OK"

      # ──────────────────────────────────────────────────────────────
      # G. Денежная операция кошелька идёт ТОЛЬКО через примитиву
      #    runWalletTransaction: pg_advisory_xact_lock ДО первого чтения +
      #    ReadCommitted + повтор при конфликте (ADR GAP-57).
      # Catches: docs/archive/audit-2026-08-25.md §H1 и откат GAP-57
      #          (возврат Serializable → P2034 → 69% отказов ставок).
      # WHY: прежняя редакция была вакуумной — она считала `$transaction` и
      #      `Serializable` в wallet.ledger.prisma.ts, где вызовов
      #      `$transaction` 0 (код переехал в wallet-transaction-lock.ts и
      #      wallet-transaction-runner.prisma.ts), а `if [ -f "$FILE" ]` молча
      #      пропускал гард при удалении файла. Гард был зелёным всегда.
      # NOTE: детектор — scripts/check-wallet-money-invariant.sh (анти-вакуум:
      #      нет файла / нет обязательного совпадения = FAIL, не skip; печатает
      #      список проверенных инвариантов). Работоспособность доказана G25.
      # ──────────────────────────────────────────────────────────────
      - name: G7 — wallet money ops go through the locking primitive
        id: g7
        run: sh scripts/check-wallet-money-invariant.sh

      # ──────────────────────────────────────────────────────────────
      # H. KYC upload must have fileFilter (MIME whitelist)
      # Catches: docs/archive/audit-2026-08-25.md §N6
      # Rule: docs/SECURITY_BASELINE.md §7.1
      # ──────────────────────────────────────────────────────────────
      - name: G8 — KYC upload has fileFilter
        id: g8
        run: |
          KYC_FILES=$(grep -rln "FileInterceptor.*file" apps/api/src/modules/kyc 2>/dev/null || true)
          if [ -n "$KYC_FILES" ]; then
            for f in $KYC_FILES; do
              if ! grep -q "fileFilter" "$f"; then
                echo "❌ G8 FAIL: $f uses FileInterceptor but has no fileFilter."
                echo "   See docs/archive/audit-2026-08-25.md §N6."
                echo "   Add: fileFilter: (req, file, cb) => { /* MIME whitelist */ }"
                exit 1
              fi
            done
          fi
          echo "✅ G8 OK"

      # ──────────────────────────────────────────────────────────────
      # I. Refresh-token cookie must use secure: NODE_ENV === 'production'
      # Catches: docs/archive/audit-2026-08-25.md §N7
      # Rule: docs/SECURITY_BASELINE.md §5.1
      # ──────────────────────────────────────────────────────────────
      - name: G9 — refresh cookie secure is conditional
        id: g9
        run: |
          # Look for hardcoded secure: false in auth controller
          HITS=$(grep -rnE "secure:\s*false" \
            apps/api/src/modules/auth/presentation 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G9 FAIL: hardcoded secure: false in auth:"
            echo "$HITS"
            echo "   See docs/archive/audit-2026-08-25.md §N7."
            echo "   Use secure: process.env['NODE_ENV'] === 'production'."
            exit 1
          fi
          echo "✅ G9 OK"

      # ──────────────────────────────────────────────────────────────
      # J. Dockerfile must set USER (non-root)
      # Catches: docs/archive/audit-2026-08-25.md §N11
      # Rule: docs/SECURITY_CHECKLIST.md §Infra, OWASP
      # ──────────────────────────────────────────────────────────────
      - name: G10 — Dockerfiles use non-root USER
        id: g10
        run: |
          DOCKERFILES=$(find infra/docker -name "*.Dockerfile" 2>/dev/null || true)
          FAILED=0
          for f in $DOCKERFILES; do
            if ! grep -qE "^USER\s+\w" "$f"; then
              echo "❌ G10 FAIL: $f has no USER directive (running as root)."
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "   See docs/archive/audit-2026-08-25.md §N11."
            echo "   Add 'USER node' (or other non-root) before CMD."
            exit 1
          fi
          echo "✅ G10 OK"

      # ──────────────────────────────────────────────────────────────
      # K. No secrets in env.example placeholders that look production-ready
      # Catches: regressions in docs/SECURITY_BASELINE.md §10
      # ──────────────────────────────────────────────────────────────
      - name: G11 — env.example uses obvious placeholders
        id: g11
        run: |
          if [ -f .env.example ]; then
            # 'change_me' / 'replace_me' is fine. 'dev_xxx' with 64+ chars that
            # could pass min(64) in zod is dangerous.
            BAD=$(grep -E "dev_[a-z_]+_REPLACE_WITH" .env.example 2>/dev/null \
              | awk 'length($0) > 80' || true)
            if [ -n "$BAD" ]; then
              echo "❌ G11 FAIL: long dev placeholders in .env.example (could pass min-64 zod check):"
              echo "$BAD" | head -5
              echo "   See docs/archive/audit-2026-08-25.md §N10 and docs/SECURITY_BASELINE.md §10.3."
              echo "   Use shorter placeholders like 'REPLACE_ME' so production deploys fail fast."
              exit 1
            fi
          fi
          echo "✅ G11 OK"

      # ──────────────────────────────────────────────────────────────
      # L. Branch name follows convention
      # Catches: docs/CONVENTIONS.md §10.1
      # ──────────────────────────────────────────────────────────────
      - name: G12 — branch name follows convention
        id: g12
        if: github.event_name == 'pull_request'
        run: |
          BR="${{ github.head_ref }}"
          if [ -z "$BR" ]; then
            BR="${{ github.ref_name }}"
          fi
          # arena/* — ветки платформы Arena (agent-сессии): имя фиксирует платформа
          # (arena/<session-id>-<slug>), переименовать нельзя. Без этого исключения
          # любой PR из такой ветки краснел на G12 — по имени ветки, а не по делу,
          # и job обрывался до остальных guard'ов (GAP-59: G23 не доходил до прогона).
          if ! echo "$BR" | grep -qE "^(feat|fix|chore|docs|refactor|test|perf|style|security|wip)/|^arena/[a-z0-9._-]+$"; then
            echo "❌ G12 FAIL: branch '$BR' does not follow type/name convention."
            echo "   Use one of: feat/, fix/, chore/, docs/, refactor/, test/, perf/, style/, security/, wip/"
            echo "   See docs/CONVENTIONS.md §10.1."
            exit 1
          fi
          echo "✅ G12 OK (branch: $BR)"

      # ──────────────────────────────────────────────────────────────
      # M. Tier 1: порог «0 warnings» закрепобрён в lint-скриптах приложений
      # Catches: молчаливый возврат долга GAP-39. Без --max-warnings eslint
      #          отдаёт exit 0 при тысячах warnings (exit-code отражает только
      #          errors) — ровно так GAP-39 и жил с 1171 warning при зелёном CI.
      # Rule: docs/QUALITY_GATES.md §2.4; критерий приёмки 1 из GAP-39
      # ──────────────────────────────────────────────────────────────
      - name: G13 — lint scripts enforce zero warnings
        id: g13
        run: |
          MISS=""
          for p in apps/api apps/web apps/admin; do
            grep -q -- '--max-warnings=0' "$p/package.json" || MISS="$MISS $p"
          done
          if [ -n "$MISS" ]; then
            echo "❌ G13 FAIL: в lint-скриптах не найдено --max-warnings=0:$MISS"
            echo '   Без флага pnpm lint зелёный и при тысячах warnings — exit-code показывает только errors.'
            echo '   См. docs/QUALITY_GATES.md §2.4 и критерий приёмки 1 из GAP-39.'
            exit 1
          fi
          echo "✅ G13 OK (api/web/admin: --max-warnings=0)"
      # N. У правила max-lines-per-function больше нет ни одного исключения
      # Catches: возврат GAP-48. До него inline-`eslint-disable` был единственным
      #          местом, где формальное error(60) не действовало; без чека такой
      #          «костыль» заводится молча при первом же длинном методе.
      # Rule: docs/QUALITY_GATES.md §2.1 (порог) и §2.1.1 (как оформлять исключения)
      # NOTE: в ветке нумерация идёт после G12; после мержа #60 (G13) при ребейзе
      #       шаг встаёт между G13 и «Final summary».
      # ──────────────────────────────────────────────────────────────
      - name: G14 — no eslint-disable for max-lines-per-function
        id: g14
        run: |
          HITS=$(grep -rnE 'eslint-disable.*max-lines-per-function' apps packages --include='*.ts' 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G14 FAIL: правило max-lines-per-function (error, 60) подавлено в:"
            echo "$HITS" | sed 's/^/   /'
            echo '   Длинный метод — сигнал о смешанной ответственности: разбить на приватные хелперы.'
            echo '   Обоснованные исключения — только overrides в .eslintrc.js с обоснованием (QUALITY_GATES §2.1.1), не inline-disable.'
            exit 1
          fi
          echo "✅ G14 OK (ни одного подавления max-lines-per-function)"

      # ──────────────────────────────────────────────────────────────
      # O. Domain layer — framework-agnostic (жёсткий гард: нарушений 0)
      # Rule: docs/AI_DEVELOPMENT_RULES.md §3.2, docs/ARCHITECTURE.md §2
      # Дублирует ESLint-override (domain, error) как вторая линия обороны.
      # ──────────────────────────────────────────────────────────────
      - name: G15 — domain layer is framework-agnostic
        id: g15
        run: |
          HITS=$(grep -rnE "from ['\"]@nestjs" \
            apps/api/src/modules/*/domain --include="*.ts" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "❌ G15 FAIL: NestJS imports in domain layer:"
            echo "$HITS" | sed 's/^/   /'
            echo "   Domain must be pure TypeScript. See docs/AI_DEVELOPMENT_RULES.md §3.2."
            exit 1
          fi
          echo "✅ G15 OK (no NestJS in domain)"

      # ──────────────────────────────────────────────────────────────
      # P. Ratchet-гарды техдолга (G16–G21): правило в error, но СУЩЕСТВУЮЩИЙ
      #    долг заморожен в tech-debt/<name>.txt. Сравнение — число нарушений
      #    на файл: рост → FAIL, уменьшение → STALE (базлайн надо ужать),
      #    равенство → OK. Детектор один — scripts/bin/tech-debt (правь его,
      #    не здесь).
      #    Exit codes: 0 OK / 1 рост / 2 ошибка использования / 3 STALE.
      #    STALE краснит CI намеренно: неверный базлайн молча разрешает рост
      #    до своей величины, а «вечно жёлтый» гард не читает никто (G18 шумел
      #    предупреждением с 30.09 по 02.10 и был проигнорирован). Правка на
      #    один флаг в переходных прогонах — `check --allow-stale <name>`.
      #    Реестр и план погашения: docs/TECH_DEBT.md
      # ──────────────────────────────────────────────────────────────
      - name: G16 — cross-module deep imports (ratchet)
        id: g16
        run: sh scripts/bin/tech-debt check cross-module-imports

      - name: G17 — no raw new Error() in api (ratchet)
        id: g17
        run: sh scripts/bin/tech-debt check raw-error

      - name: G18 — no NestJS built-in exceptions (ratchet)
        id: g18
        run: sh scripts/bin/tech-debt check nest-exceptions

      - name: G19 — eslint-disable burn-down (ratchet)
        id: g19
        run: sh scripts/bin/tech-debt check eslint-disable

      - name: G20 — money fields are never number (ratchet)
        id: g20
        run: sh scripts/bin/tech-debt check money-number

      - name: G21 — use-cases have tests (ratchet)
        id: g21
        run: sh scripts/bin/tech-debt check use-case-specs

      # ──────────────────────────────────────────────────────────────
      # R. Сервисы с тестами (число G26 — следующее свободное; порядок шагов в
      #    файле не обязан соответствовать номерам, зато номера не переиспользуются)
      # Rule: docs/CONVENTIONS.md §11 (тест на каждую единицу логики),
      #       базлайн tech-debt/service-specs.txt, реестр docs/TECH_DEBT.md
      # Критерий СТРОЖЕ G21: покрытием считается парная *.service.spec.ts ИЛИ вызов
      #   `new <Class>(` в любом спеке. Просто упоминание имени класса — нет:
      #   DI-wiring-спеки (admin-module-wiring, admin-contract) перечисляют все
      #   провайдеры модуля, и при мягком критерии 85-строчная подпись админских
      #   токенов выглядела бы протестированной, хотя ни один ассерт её не трогает.
      # Анти-вакуум: сценарии 11–13 в G25 (guard-selftest) — ловушка красная,
      #   `new X()` зелёная, «только упомянут» снова красная.
      # ──────────────────────────────────────────────────────────────
      - name: G26 — services have tests (ratchet)
        id: g26
        run: sh scripts/bin/tech-debt check service-specs

      # ──────────────────────────────────────────────────────────────
      # U. Presentation не ходит в БД (число G27 — следующее свободное)
      # Rule: docs/AI_DEVELOPMENT_RULES.md §3.3 (пример «❌ логика в controller»
      #       там же — контроллер, который сам зовёт prisma), docs/ARCHITECTURE.md
      # Catches: 9 контроллеров (admin-finance, casino-admin, referrals*,
      #          wallet, admin-users, admin-audit, casino, provider-callback),
      #          которые читают payment_requests / ledger_entry / каталог мимо
      #          фасадов модулей-владельцев, и ЛЮБОЕ новое prisma/tx обращение
      #          в presentation — включая запись в свою таблицу (её foreign-writes
      #          не ловит: там про чужие таблицы, а не про слои).
      # Базлайн: tech-debt/presentation-db.txt, заведён ПО ФАКТУ 2026-10-05 —
      #          9 файлов / 37 вхождений. Рост → FAIL, погашено и не ужмят → STALE.
      # Анти-вакуум: сценарии 14–16 в G25 — копия дерева зелёная, ловушка в
      #          presentation красная, тот же вызов в infrastructure зелёный
      #          (правило про слой, а не про таблицу).
      # ──────────────────────────────────────────────────────────────
      - name: G27 — presentation does not touch the database (ratchet)
        id: g27
        run: sh scripts/bin/tech-debt check presentation-db

      # ──────────────────────────────────────────────────────────────
      # Q. Явный Nest-DI (гард найден при переезде на TS 6 / tsgo)
      # Catches: emitDecoratorMetadata:false → конструктор без @Inject собирается,
      #          проходит tsc и ESLint, и падает в рантайме первым же вызовом
      #          («Cannot read properties of undefined (reading 'execute')»).
      #          Поймано E2E player-lifecycle: AuthController с 10 неявными params.
      # Rule: docs/ARCHITECTURE.md §5.3, docs/AI_DEVELOPMENT_RULES.md §3.2,
      #       docs/MODULE_TEMPLATE.md (каркасы провайдеров)
      # NOTE: детектор — scripts/check-explicit-di.mjs (без зависимостей, node из образа)
      # ──────────────────────────────────────────────────────────────
      - name: G22 — Nest DI tokens are declared explicitly
        id: g22
        run: node scripts/check-explicit-di.mjs

      # ──────────────────────────────────────────────────────────────
      # Q2. Привязка параметров HTTP-хендлеров (сосед G22 по классу бага:
      #     и там, и тут Nest молча отдаёт undefined, код компилируется и живёт
      #     до первого обращения к полю)
      # Catches: #197 — кабинет партнёра: у десяти параметров хендлеров
      #          AffiliateController не было param-декоратора, поэтому
      #          /affiliate/me|dashboard|links|commissions|players давали 500
      #          при любом токене, а UI без ветки isError показывал «Загрузка…».
      #          Contract-спека не ловит: она вызывает методы напрямую и
      #          передаёт актора аргументом — HTTP-связывание ей недоступно.
      # Rule: docs/ARCHITECTURE.md §5.3, docs/API_CONVENTIONS.md §2
      # NOTE: детектор — scripts/check-controller-params.mjs; краснеет и когда
      #          не просканировал ни одного хендлера (урок вакуумного G7).
      # ──────────────────────────────────────────────────────────────
      - name: G28 — controller handler params are bound explicitly
        id: g28
        run: node scripts/check-controller-params.mjs

      # R. NEXT_PUBLIC_* инлайнятся в бандл на сборке (Next.js), поэтому env_file
      #    на build не влияет — ARG обязан приехать через build.args.
      # Catches: GAP-59 — build-arg NEXT_PUBLIC_API_URL был у web, но не у admin;
      #          бандл админки запекал ARG-дефолт casino.example.com и на реальном
      #          домене уходил на чужой хост (vhost admin без location /api/).
      #          CI не ловил: job docker-build собирает только api.prod.
      # NOTE: детектор — scripts/check-prod-build-args.sh (grep/awk, без зависимостей)
      - name: G23 — NEXT_PUBLIC_ args reach prod builds
        id: g23
        run: sh scripts/check-prod-build-args.sh

      # ──────────────────────────────────────────────────────────────
      # S. Чужие записи Prisma (ratchet): write по модели, владельцем которой
      #    модуль НЕ является. ЧТЕНИЯ (find*/count/aggregate/groupBy) не
      #    считаются — ADR GAP-51 легализует read-only межмодульный доступ.
      # Catches: GAP-62 (affiliate писал в users) и любые новые чужие мутации;
      #          карта владения MODEL_OWNERS в scripts/bin/tech-debt — источник
      #          истины, пополняется при добавлении модели (иначе детектор
      #          отказывается работать: exit 2, а не молчаливый пропуск).
      # Rule: docs/AI_DEVELOPMENT_RULES.md §4, docs/MODULE_BOUNDARIES.md
      # Реестр: docs/TECH_DEBT.md (строка G24), базлайн tech-debt/foreign-writes.txt
      - name: G24 — no writes into foreign Prisma tables (ratchet)
        id: g24
        run: sh scripts/bin/tech-debt check foreign-writes

      # ──────────────────────────────────────────────────────────────
      # T. Анти-вакуум: каждый гард обязан доказать, что краснеет.
      # Catches: ровно то, из-за чего G7 умер молча (зелёный гард, который
      #          ничего не проверяет). В temp-дереве кладётся файл-ловушка /
      #          портится примитива, прогонятся ТЕ ЖЕ детекторы (G7 и G24), и
      #          требуется ненулевой exit-code с фирменной сигнатурой отказа;
      #          параллельно проверяется, что на чистом дереве и на легальных
      #          ЧТЕНИЯХ гарды зелёные (иначе «красный» гард ничего не стоит).
      # Rule: docs/QUALITY_GATES.md §3.6
      # NOTE: рабочий код не меняется — сценарии живут в копиях дерева.
      # ──────────────────────────────────────────────────────────────
      - name: G25 — guards prove they fail (anti-vacuum selftest)
        id: g25
        run: sh scripts/bin/guard-selftest

      # ── Final summary ─────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "Architecture guard summary:"
          echo "- G1  prisma layer:        ${{ steps.g1.outcome }}"
          echo "- G2  no @ts-ignore:       ${{ steps.g2.outcome }}"
          echo "- G3  no console.log:      ${{ steps.g3.outcome }}"
          echo "- G4  Zod on controllers:  ${{ steps.g4.outcome }}"
          echo "- G5  webhook raw body:    ${{ steps.g5.outcome }}"
          echo "- G6  status match safe:   ${{ steps.g6.outcome }}"
          echo "- G7  wallet money primitive: ${{ steps.g7.outcome }}"
          echo "- G8  KYC fileFilter:      ${{ steps.g8.outcome }}"
          echo "- G9  cookie secure:       ${{ steps.g9.outcome }}"
          echo "- G10 docker non-root:     ${{ steps.g10.outcome }}"
          echo "- G11 env placeholders:    ${{ steps.g11.outcome }}"
          echo "- G12 branch name:         ${{ steps.g12.outcome }}"
          echo "- G13 zero-warnings gate:  ${{ steps.g13.outcome }}"
          echo "- G14 no max-lines escape: ${{ steps.g14.outcome }}"
          echo "- G15 domain framework-free: ${{ steps.g15.outcome }}"
          echo "- G16 cross-module ratchet: ${{ steps.g16.outcome }}"
          echo "- G17 raw Error ratchet:   ${{ steps.g17.outcome }}"
          echo "- G18 nest-exceptions rat.: ${{ steps.g18.outcome }}"
          echo "- G19 eslint-disable rat.:  ${{ steps.g19.outcome }}"
          echo "- G20 money-number ratchet: ${{ steps.g20.outcome }}"
          echo "- G21 use-case specs rat.:  ${{ steps.g21.outcome }}"
          echo "- G22 explicit Nest DI:     ${{ steps.g22.outcome }}"
          echo "- G28 controller params:    ${{ steps.g28.outcome }}"
          echo "- G23 NEXT_PUBLIC_ args:    ${{ steps.g23.outcome }}"
          echo "- G24 foreign writes ratch.: ${{ steps.g24.outcome }}"
          echo "- G26 service specs ratchet: ${{ steps.g26.outcome }}"
          echo "- G27 presentation-db ratchet: ${{ steps.g27.outcome }}"
          echo "- G25 anti-vacuum selftest: ${{ steps.g25.outcome }}"
