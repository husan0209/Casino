# Pre-launch (аудит 2026-09-04): авто-PR обновлений безопасности.
# Weekly, только security-релевантные группы; для pnpm-проекта npm-ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /casino-platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    commit-message:
      prefix: chore
      scope: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
